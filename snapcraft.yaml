        craftctl default
        while read -r PATCHFILE ; do
            patch -p1 < "$CRAFT_PROJECT_DIR/patches/karchive/$PATCHFILE"
        done < $CRAFT_PROJECT_DIR/patches/karchive/series
  kcodecs:
    after:
      - extra-cmake-modules
      - qtconf
    source: https://invent.kde.org/frameworks/kcodecs.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - gperf
      - doxygen
      - graphviz
    build-snaps:
