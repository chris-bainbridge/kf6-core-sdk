---
name: kf6-core24-sdk
# Please update to match &kf6-version, &plasma-version, &apps-version
version: 6.11.0-6.2.5-24.12.3
summary: KDE Frameworks 6
description: KDE Frameworks are addons and useful extensions to Qt
confinement: strict
grade: stable
base: core24
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
environment:
  LD_LIBRARY_PATH: "/snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libproxy:/snap/kde-qt6-core24-sdk/current/usr/lib:$SNAP/usr/lib:$SNAP/lib/:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib:/lib"
  GDK_PIXBUF_MODULE_FILE: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
slots: {}
package-repositories:
-   type: apt
    components:
    - main
    suites:
    - noble
    key-id: 444DABCF3667D0283F894EDDE6D4736255751E5D
    url: http://origin.archive.neon.kde.org/user
    key-server: keyserver.ubuntu.com
parts:
  libtool:
    plugin: nil
    stage-packages:
      - libtool
      - libtool-bin
    override-stage: |
      set -eux
      craftctl default
      LIBTOOLIZE=usr/bin/libtoolize
      sed -i 's#pkgauxdir="#pkgauxdir="$CRAFT_STAGE#' $LIBTOOLIZE
      sed -i 's#pkgltdldir="#pkgltdldir="$CRAFT_STAGE#' $LIBTOOLIZE
      sed -i 's#aclocaldir="#aclocaldir="$CRAFT_STAGE#' $LIBTOOLIZE

  libffi:
    after: [ libtool, meson-deps ]
    source: https://gitlab.freedesktop.org/gstreamer/meson-ports/libffi.git
    source-tag: 'meson-3.2.9999.4'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
    build-environment: &buildenvironment
      - PATH: /snap/kde-qt6-core24-sdk/current/usr/bin${PATH:+:$PATH}
      - PKG_CONFIG_PATH: /snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - XDG_DATA_DIRS: $CRAFT_STAGE/usr/share:/snap/kde-qt6-core24-sdk/current/usr/share:/usr/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}
      - XDG_CONFIG_HOME: $CRAFT_STAGE/etc/xdg:/snap/kde-qt6-core24-sdk/current/etc/xdg:/etc/xdg${XDG_CONFIG_HOME:+:$XDG_CONFIG_HOME}
      - LD_LIBRARY_PATH: "/snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/snap/kde-qt6-core24-sdk/current/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libproxy:/snap/kde-qt6-core24-sdk/current/usr/lib:$CRAFT_STAGE/usr/lib:$CRAFT_STAGE/lib/:$CRAFT_STAGE/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
  glib:
    after: [ libffi, meson-deps ]
    source: https://gitlab.gnome.org/GNOME/glib.git
    source-tag: '2.84.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
    build-environment: *buildenvironment
    override-build: |
      set -eux
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
      cp $CRAFT_PART_INSTALL/usr/bin/{gio-querymodules,glib-compile-schemas} $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
    build-packages:
      - pkg-config
      - libmount-dev
      - libdbus-1-dev
      - gcc
      - g++
      - clang
  ninja:
    plugin: nil
    source: https://github.com/ninja-build/ninja.git
    source-tag: 'v1.11.1'
    source-depth: 1
    build-environment: *buildenvironment
    override-build: |
      rm -rf build
      rm -f ninja
      rm -f ninja_bootstrap
      sed -i 's_^#!/usr/bin/env python$_#!/usr/bin/env python3_g' configure.py
      ./configure.py --bootstrap
      mv ninja ninja_bootstrap
      rm -rf build
      ./ninja_bootstrap
      rm -f ninja_bootstrap
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mv ninja $CRAFT_PART_INSTALL/usr/bin/
    build-packages:
      - python3

  meson-deps:
    after: [ ninja ]
    plugin: nil
    source: https://github.com/mesonbuild/meson.git
    source-tag: '1.4.0'
    source-depth: 1
    build-environment: *buildenvironment
    override-build: |
      python3 -m pip install --break-system-packages .
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/meson*
      python3 -m pip install --target=$CRAFT_PART_INSTALL/usr --break-system-packages .
      mv $CRAFT_PART_INSTALL/usr/meson* $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/
      sed -i "s%^#!/usr/bin/python3$%#!/usr/bin/env python3%g" /usr/local/bin/meson
      sed -i "s%^#!/usr/bin/python3$%#!/usr/bin/env python3%g" $CRAFT_PART_INSTALL/usr/bin/meson
    build-packages:
      - python3-pip

  gdk-pixbuf:
    after: [ meson-deps ]
    source: https://gitlab.gnome.org/GNOME/gdk-pixbuf.git
    source-tag: '2.42.12'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dinstalled_tests=false
      - -Dgtk_doc=false
      - -Ddocs=false
      - -Dintrospection=enabled
      - -Dman=false
      - -Dtests=false
      - -Dinstalled_tests=false
    build-environment: *buildenvironment
    override-build: |
      set -eux
      craftctl default
      cp $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $CRAFT_STAGE/usr/bin/
      LOADERS_PATH=$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders
      $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $LOADERS_PATH/*.so > $LOADERS_PATH.cache
      # workaround for thumbnailer being in a different directory in the snap env
      sed -i 's#/usr/bin/##' $CRAFT_PART_INSTALL/usr/share/thumbnailers/gdk-pixbuf-thumbnailer.thumbnailer
    organize:
      usr/bin/gdk-pixbuf-query-loaders: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
    build-packages:
      - libpng-dev
      - libjpeg-dev
      - libtiff-dev
      - libpango1.0-dev

  gsettings-desktop-schemas:
    after:
      - meson-deps
      - ninja
    source: https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas.git
    source-tag: '42.0'
    source-depth: 1
    build-environment: *buildenvironment
    build-packages:
      - libgirepository-1.0-dev
    stage-packages:
      - libgirepository-1.0-1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
    override-build: |
      set -eux
      craftctl default
      PC=$CRAFT_PART_INSTALL/usr/share/pkgconfig/gsettings-desktop-schemas.pc
      sed -i 's#-I/usr#-I${prefix}#' $PC

  qtconf:
    after:
    - gsettings-desktop-schemas
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cat <<EOF > $CRAFT_PART_INSTALL/usr/bin/qt.conf
      [Paths]
      Prefix = ../../
      LibraryExecutables = usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/libexec
      Plugins = usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
      Qml2Imports = usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/qml
      Translations = usr/share/qt6/translations
      Data = usr/share/qt6
      EOF
  missing-deps:
    after:
      - qtconf
    plugin: nil
    stage-packages:
      - libpcre2-16-0
      - libegl1
      - libclang-cpp14
      - libsm6
      - libice6
      - libfbclient2
  extra-cmake-modules:
    after:
      - qtconf
    source: https://invent.kde.org/frameworks/extra-cmake-modules.git
    source-tag: &kf6-version v6.11.0
    source-depth: 1
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: &cmakeparameters
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_MAJOR_VERSION=6
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TESTING=OFF
      - -DCMAKE_INSTALL_SYSCONFDIR=/etc
      - -DCMAKE_INSTALL_LOCALSTATEDIR=/var
      - -DCMAKE_EXPORT_NO_PACKAGE_REGISTRY=ON
      - -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
      - -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON
      - -DCMAKE_INSTALL_RUNSTATEDIR=/run
      - -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON
      - -DCMAKE_VERBOSE_MAKEFILE=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DCMAKE_INSTALL_LIBDIR=lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      - -DENABLE_DOCS=OFF
      - --log-level=STATUS
      - -DCMAKE_LIBRARY_PATH=lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      - "-DCMAKE_FIND_ROOT_PATH=$CRAFT_STAGE\\;/snap/kde-qt6-core24-sdk/current\\;/usr"
      - "-DCMAKE_PREFIX_PATH=$CRAFT_STAGE\\;/snap/kde-qt6-core24-sdk/current\\;/usr"
    build-environment: *buildenvironment
    stage-packages:
      - python3
  plasma-wayland-protocols:
    after:
      - extra-cmake-modules
      - qtconf
    source: https://invent.kde.org/libraries/plasma-wayland-protocols.git
    source-branch: master
    source-depth: 1
    stage-packages:
      - wayland-protocols
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  qca:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/libraries/qca.git
    source-branch: master
    source-depth: 1
    build-packages:
      - ca-certificates
      - gnupg
      - libsasl2-dev
      - libssl-dev
      - pkg-config
      - rsync
      - libproxy1v5
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
    override-stage: |
        craftctl default
        rsync -a --ignore-existing $CRAFT_PART_INSTALL/ /
  polkit-qt-1:
    after:
      - qtconf
    source: https://invent.kde.org/libraries/polkit-qt-1.git
    source-branch: master
    source-depth: 1
    build-packages:
      - libglib2.0-dev
      - libpolkit-agent-1-dev
      - libpolkit-gobject-1-dev
    stage-packages:
      - default-logind
      - libpolkit-agent-1-0
      - libpolkit-gobject-1-0
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  kirigami:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/frameworks/kirigami.git
    source-tag: *kf6-version
    source-depth: 1
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
    stage-packages:
      - libgomp1
  kplotting:
    after:
      - extra-cmake-modules
      - missing-deps
    source: https://invent.kde.org/frameworks/kplotting.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - cmake
      - libglx-dev
      - libgl1-mesa-dev
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  syntax-highlighting:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/frameworks/syntax-highlighting.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - perl
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  kdnssd:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/frameworks/kdnssd.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - graphviz
      - doxygen
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  kitemmodels:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/frameworks/kitemmodels.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - graphviz
      - doxygen
    build-snaps:
      - kde-qt6-core24-sdk/latest/edge
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
  threadweaver:
    after:
      - extra-cmake-modules
    source: https://invent.kde.org/frameworks/threadweaver.git
    source-tag: *kf6-version
    source-depth: 1
