---
name: kf6-core26-sdk
# Please update to match qt-version, &kf6-version, &plasma-version, &apps-version
version: 6.11.1-6.30.0-6.7.5-26.04.2
summary: KDE Frameworks 6
description: KDE Frameworks are addons and useful extensions to Qt
confinement: strict
grade: stable
base: core26
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
environment:
  LD_LIBRARY_PATH: "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libproxy:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib:$SNAP/usr/lib:$SNAP/lib/:$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:/usr/lib:/lib"
  GDK_PIXBUF_MODULE_FILE: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
  PYTHONPATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/python3.14:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/python3/dist-packages:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/python3.14:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/python3/dist-packages
slots: {}
parts:
  sdk-qt6:
    plugin: dump
    source: .sdk/kde-qt6-core26-sdk
    organize:
      '*': kde-qt6-core26-sdk/
    override-stage: |
      # The Qt SDK snap's pkg-config (.pc) files hardcode absolute
      # /snap/kde-qt6-core26-sdk/current/... paths. CMake's
      # CMAKE_FIND_ROOT_PATH re-roots those to $CRAFT_STAGE/snap/..., so
      # symlink $CRAFT_STAGE/snap/kde-qt6-core26-sdk/current to the staged
      # SDK (and also /snap/... for any non-re-rooted consumers).
      craftctl default
      mkdir -p "$CRAFT_STAGE/snap/kde-qt6-core26-sdk"
      ln -sfn "$CRAFT_STAGE/kde-qt6-core26-sdk" "$CRAFT_STAGE/snap/kde-qt6-core26-sdk/current"
      mkdir -p /snap/kde-qt6-core26-sdk
      ln -sfn "$CRAFT_STAGE/kde-qt6-core26-sdk" /snap/kde-qt6-core26-sdk/current

  sdk-pyside6:
    plugin: dump
    source: .sdk/kde-pyside6-core26-sdk
    organize:
      '*': kde-pyside6-core26-sdk/
    override-stage: |
      craftctl default
      mkdir -p "$CRAFT_STAGE/snap/kde-pyside6-core26-sdk"
      ln -sfn "$CRAFT_STAGE/kde-pyside6-core26-sdk" "$CRAFT_STAGE/snap/kde-pyside6-core26-sdk/current"
      mkdir -p /snap/kde-pyside6-core26-sdk
      ln -sfn "$CRAFT_STAGE/kde-pyside6-core26-sdk" /snap/kde-pyside6-core26-sdk/current

  libffi:
    after: [ meson-deps ]
    source: https://gitlab.freedesktop.org/gstreamer/meson-ports/libffi.git
    source-tag: 'meson-3.2.9999.4'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
    build-environment: &buildenvironment
      - CCACHE_DIR: ${SNAPCRAFT_PROJECT_DIR}/.ccache
      - CCACHE_NOHASHDIR: "true"
      - PATH: /usr/lib/ccache:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/bin${PATH:+:$PATH}
      # The staged SDK's python3 shadows the host interpreter used by Meson's
      # /usr/local/bin/meson launcher during plugin environment validation.
      - PYTHONPATH: /usr/local/lib/python3.14/dist-packages${PYTHONPATH:+:$PYTHONPATH}
      - PKG_CONFIG_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - XDG_DATA_DIRS: $CRAFT_STAGE/usr/share:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/share:/usr/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}
      - XDG_CONFIG_HOME: $CRAFT_STAGE/etc/xdg:$CRAFT_STAGE/kde-qt6-core26-sdk/etc/xdg:/etc/xdg${XDG_CONFIG_HOME:+:$XDG_CONFIG_HOME}
      - LIBCLANG_LIBDIR: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/lib
      - LIBCLANG_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/bin
      - LLVM_INSTALL_DIR: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19
      - PATH: /usr/lib/ccache:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/bin:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/bin:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/bin${PATH:+:$PATH}
      - QT_PLUGIN_PATH: "$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:/snap/kf6-core24/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins"
      - QML_IMPORT_PATH: "$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:/snap/kf6-core24/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml"
      - QT_INSTALL_QML: $QML_IMPORT_PATH
      - LD_LIBRARY_PATH: "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libproxy:$CRAFT_STAGE/lib:$CRAFT_STAGE/usr/lib:$CRAFT_STAGE/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

  glib:
    after: [ meson-deps ]
    source: https://gitlab.gnome.org/GNOME/glib.git
    source-tag: '2.84.0'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dtests=false
    build-environment: *buildenvironment
    override-build: |
      set -eux
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
      cp $CRAFT_PART_INSTALL/usr/bin/{gio-querymodules,glib-compile-schemas} $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
      mkdir -p "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0"
      ln -sfn "$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/gio-querymodules" "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/gio-querymodules"
      ln -sfn "$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/glib-compile-schemas" "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/glib-compile-schemas"
    build-packages:
      - binutils
      - clang-18
      - elfutils
      - gcc
      - g++
      - libmount-dev
      - libdbus-1-dev
      - libelf-dev
      - pkg-config

  ninja:
    plugin: nil
    build-packages:
      - ninja-build
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/ninja $CRAFT_PART_INSTALL/usr/bin/ninja

  meson-deps:
    after: [ ninja ]
    plugin: nil
    source: https://github.com/mesonbuild/meson.git
    source-tag: '1.10.1'
    source-depth: 1
    build-environment: *buildenvironment
    override-build: |
      # Install meson to the SYSTEM site-packages only (not a staged copy).
      # The meson plugin's validation prepends $CRAFT_STAGE/usr/bin to PATH,
      # so a staged meson there would shadow the system one and fail with
      # "No module named 'mesonbuild'" (its mesonbuild is in the staged
      # dist-packages, which the system python3 can't find). Installing only
      # to the system means `meson` resolves to /usr/local/bin/meson, whose
      # mesonbuild is in /usr/local/lib/python3.14/dist-packages (findable).
      /usr/bin/python3 -m pip install --break-system-packages .
      sed -i "s%^#!.*python3.*$%#!/usr/bin/python3%g" /usr/local/bin/meson
    build-packages:
      - python3-pip

  gdk-pixbuf:
    after: [ meson-deps ]
    source: https://gitlab.gnome.org/GNOME/gdk-pixbuf.git
    source-tag: '2.42.12'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dinstalled_tests=false
      - -Dgtk_doc=false
      - -Ddocs=false
      - -Dintrospection=enabled
      - -Dman=false
      - -Dtests=false
      - -Dinstalled_tests=false
    build-environment: *buildenvironment
    override-build: |
      set -eux
      craftctl default
      cp $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $CRAFT_STAGE/usr/bin/
      LOADERS_PATH=$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders
      $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $LOADERS_PATH/*.so > $LOADERS_PATH.cache
      # workaround for thumbnailer being in a different directory in the snap env
      sed -i 's#/usr/bin/##' $CRAFT_PART_INSTALL/usr/share/thumbnailers/gdk-pixbuf-thumbnailer.thumbnailer
    organize:
      usr/bin/gdk-pixbuf-query-loaders: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
    build-packages:
      - libpng-dev
      - libjpeg-dev
      - libtiff-dev
      - libpango1.0-dev
      - gobject-introspection

  gsettings-desktop-schemas:
    after: [ meson-deps, glib ]
    source: https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas.git
    source-tag: '46.1'
# ext:updatesnap
#   version-format:
#     same-major: true
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=true
    build-environment: *buildenvironment
    build-packages:
      - gobject-introspection
    override-build: |
      set -eux
      craftctl default
      PC=$CRAFT_PART_INSTALL/usr/share/pkgconfig/gsettings-desktop-schemas.pc
      sed -i 's#-I/usr#-I${prefix}#' $PC

  missing-deps:
    after:
      - gsettings-desktop-schemas
    plugin: nil
    stage-packages:
      - libclang-cpp18
      - libduktape207
      - libegl1
      - libfbclient2
      - libfreetype6
      - libice6
      - libpcre2-16-0
      - libsm6     
      - libxkbcommon0
      
  extra-cmake-modules:
    after:
      - missing-deps
      - sdk-qt6
    source: https://invent.kde.org/frameworks/extra-cmake-modules.git
    source-tag: &kf6-version v6.30.0
    source-depth: 1
    plugin: cmake
    build-packages:
      - ccache
    cmake-generator: Ninja
    cmake-parameters: &cmakeparameters
      - "-DCMAKE_FIND_ROOT_PATH=$CRAFT_STAGE\\:$CRAFT_STAGE/kde-qt6-core26-sdk\\:$CRAFT_STAGE/kde-pyside6-core26-sdk\\:/usr"
      - "-DCMAKE_PREFIX_PATH=$CRAFT_STAGE\\;$CRAFT_STAGE/kde-qt6-core26-sdk\\;$CRAFT_STAGE/kde-pyside6-core26-sdk\\;/usr"
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DQT_MAJOR_VERSION=6
    build-environment: *buildenvironment
    stage-packages:
      - python3

  wayland-protocols:
    after:
      - meson-deps
    source: https://gitlab.freedesktop.org/wayland/wayland-protocols.git
    source-tag: 1.47
    source-depth: 1
    plugin: meson
    build-environment:
      - PYTHONPATH: /usr/local/lib/python3.14/dist-packages${PYTHONPATH:+:$PYTHONPATH}
    build-packages:
      - libwayland-dev
      - meson
      - pkgconf

  plasma-wayland-protocols:
    after:
      - extra-cmake-modules
      - missing-deps
      - sdk-qt6
    source: https://invent.kde.org/libraries/plasma-wayland-protocols.git
    source-branch: master
    source-depth: 1
    plugin: cmake
    build-packages:
      - ccache
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  qca:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/libraries/qca.git
    source-branch: master
    source-depth: 1
    build-packages:
      - ca-certificates
      - ccache
      - gnupg
      - libsasl2-dev
      - libssl-dev
      - pkg-config
      - rsync
      - libproxy1v5
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters:
      - -DBUILD_WITH_QT6=ON
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_MAJOR_VERSION=6
      - "-DCMAKE_FIND_ROOT_PATH=$CRAFT_STAGE\\:$CRAFT_STAGE/kde-qt6-core26-sdk\\:/usr"
      - "-DCMAKE_PREFIX_PATH=$CRAFT_STAGE\\;$CRAFT_STAGE/kde-qt6-core26-sdk\\;/usr"
    build-environment: *buildenvironment
    override-stage: |
        craftctl default
        rsync -a --ignore-existing $CRAFT_PART_INSTALL/ /

  polkit-qt-1:
    after:
      - missing-deps
      - sdk-qt6
    source: https://invent.kde.org/libraries/polkit-qt-1.git
    source-branch: master
    source-depth: 1
    build-packages:
      - ccache
      - libglib2.0-dev
      - libpolkit-agent-1-dev
      - libpolkit-gobject-1-dev
    stage-packages:
      - libpolkit-agent-1-0
      - libpolkit-gobject-1-0
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  kirigami:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/kirigami.git
    source-tag: *kf6-version
    source-depth: 1
    plugin: cmake
    build-packages:
      - ccache
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
    stage-packages:
      - libgomp1

  kplotting:
    after:
      - extra-cmake-modules
      - missing-deps
      - sdk-qt6
    source: https://invent.kde.org/frameworks/kplotting.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - cmake
      - libglx-dev
      - libgl1-mesa-dev
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  syntax-highlighting:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/syntax-highlighting.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - perl
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  kdnssd:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/kdnssd.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - graphviz
      - doxygen
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  kitemmodels:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/kitemmodels.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - graphviz
      - doxygen
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  threadweaver:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/threadweaver.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - graphviz
      - doxygen
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment

  solid:
    after:
      - extra-cmake-modules
      - sdk-qt6
    source: https://invent.kde.org/frameworks/solid.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - bison
      - doxygen
      - flex
      - graphviz
      - libudev-dev
      - libimobiledevice-dev
      - libmount-dev
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
    stage-packages:
      - libimobiledevice-1.0-6
      - libmount1
      - libplist-2.0-4
      - libudev1
      - media-player-info
      - upower

  kcoreaddons:
    after:
      - extra-cmake-modules
      - missing-deps
      - sdk-qt6
      - sdk-pyside6
    source: https://invent.kde.org/frameworks/kcoreaddons.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - ccache
      - clang-18
      - doxygen
      - g++
      - gcc
      - graphviz
      - libpython3-dev
      - libpython3.14-dev
      - libudev-dev
      - python3-build
      - shared-mime-info
    stage-packages:
      - libudev1
      - shared-mime-info
    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: &cmakeparameters-kf6withpyside6
      - "-DCMAKE_FIND_ROOT_PATH=$CRAFT_STAGE\\;$CRAFT_STAGE/kde-qt6-core26-sdk\\;$CRAFT_STAGE/kde-pyside6-core26-sdk\\;/usr"
      - "-DCMAKE_PREFIX_PATH=$CRAFT_STAGE\\:$CRAFT_STAGE/kde-qt6-core26-sdk\\:$CRAFT_STAGE/kde-pyside6-core26-sdk\\:/usr"
      - -DBUILD_TESTING=OFF
      - -DBUILD_WITH_QT6=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DQT_MAJOR_VERSION=6
    build-environment: &buildenvironment-kf6withpyside6
      - CCACHE_DIR: ${SNAPCRAFT_PROJECT_DIR}/.ccache
      - CCACHE_NOHASHDIR: "true"
      - CC: /usr/bin/gcc
      - CXX: /usr/bin/g++
      - CLANG_INSTALL_DIR: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19
      - CMAKE_PREFIX_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}
      - CPATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/include:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include:$CRAFT_STAGE/usr/include/python3.14${CPATH:+:$CPATH}
      - C_INCLUDE_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/include/python3.14:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include/python3.14:$CRAFT_STAGE/usr/include/python3.14${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}
      - CPLUS_INCLUDE_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/include:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include/PySide6:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include/python3.14:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/include/shiboken6:$CRAFT_STAGE/usr/include${CPLUS_INCLUDE_PATH:+:$CPLUS_INCLUDE_PATH}
      - DICPATH: "$CRAFT_STAGE/usr/share/hunspell"
      - LD_LIBRARY_PATH: "$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libproxy:$CRAFT_STAGE/lib:$CRAFT_STAGE/usr/lib:$CRAFT_STAGE/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      - LIBCLANG_LIBDIR: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/lib
      - LIBCLANG_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/bin
      - LLVM_INSTALL_DIR: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19
      - PATH: /usr/lib/ccache:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/bin:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/llvm-19/bin:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/bin${PATH:+:$PATH}
      - PKG_CONFIG_PATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}
      - PYSIDE_DESIGNER_PLUGINS: $CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/qt6/plugins/designer
      - PYTHONPATH: $CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/python3.14:$CRAFT_STAGE/kde-qt6-core26-sdk/usr/lib/python3/dist-packages:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/python3.14:$CRAFT_STAGE/kde-pyside6-core26-sdk/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}
      - XDG_CONFIG_HOME: $CRAFT_STAGE/etc/xdg:$CRAFT_STAGE/kde-qt6-core26-sdk/etc/xdg:/etc/xdg${XDG_CONFIG_HOME:+:$XDG_CONFIG_HOME}
