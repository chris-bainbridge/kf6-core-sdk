    plugin: cmake
    cmake-generator: Ninja
    cmake-parameters: *cmakeparameters
    build-environment: *buildenvironment
    stage-packages:
      - libimobiledevice6
      - libmount1
      - libplist-2.0-4
      - libudev1
      - media-player-info
      - upower
  kwidgetsaddons:
    after:
      - plasma-wayland-protocols
      - qtconf
    source: https://invent.kde.org/frameworks/kwidgetsaddons.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - graphviz
