    source: https://invent.kde.org/frameworks/kguiaddons.git
    source-tag: *kf6-version
    source-depth: 1
    build-packages:
      - libxkbcommon-dev
      - libwayland-client0
      - libwayland-dev
      - wayland-protocols
      - doxygen
      - graphviz
      - libx11-dev
      - libxcb1-dev
      - pkg-config
      - libglx-dev
      - libgl1-mesa-dev
      - libmd4c-dev
    stage-packages:
