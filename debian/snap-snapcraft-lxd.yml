include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/blocks/workflow.yml
  - local: debian/snap-base.yml

snap_snapcraft_lxc:
  extends: .snap_base
  inherit:
    default: true
  script:
    - echo building $KDE_SNAP_MODULE_NAME $KDE_SNAP_MODULE_VERSION with --use-lxd ...
    - snapcraft  --use-lxd --verbosity=debug
  interruptible: true
